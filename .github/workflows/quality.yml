name: Quality checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:programs && npm run test:courses && npm run test:admin && npm run test:db
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://admin-test.invalid
          VITE_SUPABASE_ANON_KEY: test-public-placeholder
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npx wrangler pages functions build functions --outdir /tmp/choomcham-functions-check
      - run: npm run build
